name: SPDM Emulator PQC Test

# Post-quantum interop (ML-DSA signing + ML-KEM key exchange, and a full-PQ
# combination), mirroring the classical SPDM Emulator Integration Test matrix
# (ubuntu 22.04/24.04 x64 + 24.04 aarch64, each with static and dynamic memory).
# The wc_MlDsaKey context API wolfSPDM verifies with lands post-v5.9.1-stable,
# so this job pins wolfSSL master. libspdm's ML-DSA/ML-KEM are only in its
# OpenSSL backend (the mbedtls backend stubs them out), so spdm-emu is built
# with CRYPTO=openssl.

on:
  push:
    branches: [ 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  repository_dispatch:
    types: [nightly-trigger]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pqc-emu-test:
    name: ${{ matrix.os }} (${{ matrix.arch }}) / dynamic-mem=${{ matrix.dynamic-mem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            dynamic-mem: 'no'
          - os: ubuntu-22.04
            arch: x64
            dynamic-mem: 'yes'
          - os: ubuntu-24.04
            arch: x64
            dynamic-mem: 'no'
          - os: ubuntu-24.04
            arch: x64
            dynamic-mem: 'yes'
          - os: ubuntu-24.04-arm
            arch: aarch64
            dynamic-mem: 'no'
          - os: ubuntu-24.04-arm
            arch: aarch64
            dynamic-mem: 'yes'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool cmake

      - name: Compute cache period
        id: cache-period
        run: echo "biweekly=$(( $(date +%s) / 1296000 ))" >> $GITHUB_OUTPUT

      # --- wolfSSL master with ML-DSA (rebuilt to track upstream drift) ---
      - name: Build wolfSSL master (--enable-mldsa --enable-mlkem)
        run: |
          cd ~
          git clone --depth 1 --branch master https://github.com/wolfSSL/wolfssl.git
          cd wolfssl
          ./autogen.sh
          ./configure --enable-ecc --enable-sha384 --enable-aesgcm \
                      --enable-hkdf --enable-sp --enable-mldsa --enable-mlkem \
                      --prefix=$HOME/wolfssl-install
          make -j"$(nproc)"
          make install
          grep LIBWOLFSSL_VERSION_STRING $HOME/wolfssl-install/include/wolfssl/version.h

      # --- ML-KEM without ML-DSA: a real config (ML-KEM/Kyber is commonly
      #     enabled for TLS hybrid KEX while ML-DSA is not). Exercises the
      #     ML-KEM-only WOLFSPDM_CTX_STATIC_SIZE budget and unit tests, which
      #     the combined build below does not. Cleaned up before the full build. ---
      - name: Build + test wolfSPDM ML-KEM-only (--disable-mldsa --enable-mlkem)
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/.libs:${{ github.workspace }}/src/.libs:$HOME/wolfssl-install/lib"
          ./autogen.sh
          ./configure --with-wolfssl=$HOME/wolfssl-install \
                      --disable-mldsa --enable-mlkem \
                      ${{ matrix.dynamic-mem == 'yes' && '--enable-dynamic-mem' || '' }}
          make -j"$(nproc)"
          make check
          make distclean

      # --- wolfSPDM with ML-DSA + ML-KEM asserted on, static or dynamic memory ---
      - name: Build and install wolfSPDM (--enable-mldsa --enable-mlkem)
        run: |
          ./autogen.sh
          ./configure --with-wolfssl=$HOME/wolfssl-install \
                      --prefix=$HOME/wolfspdm-install --enable-mldsa --enable-mlkem \
                      ${{ matrix.dynamic-mem == 'yes' && '--enable-dynamic-mem' || '' }}
          make -j"$(nproc)"
          make install

      - name: Run unit tests (includes ML-DSA verify + ML-KEM decap)
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/.libs:${{ github.workspace }}/src/.libs:$HOME/wolfssl-install/lib"
          make check

      # --- spdm-emu with OpenSSL backend (ML-DSA), cached per OS/arch ---
      # Cache the whole build tree, not just build/bin: the OpenSSL-backed
      # responder depends on the bundled OpenSSL libraries/providers built
      # elsewhere under build/, so a build/bin-only cache restores a binary
      # that fails mid-handshake. The full tree makes a restored build behave
      # identically to a fresh one.
      - name: Cache spdm-emu (openssl)
        id: cache-spdm-emu
        uses: actions/cache@v4
        with:
          path: ~/spdm-emu/build
          key: spdm-emu-pqc-openssl-v4-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.cache-period.outputs.biweekly }}

      - name: Build spdm-emu (CRYPTO=openssl)
        if: steps.cache-spdm-emu.outputs.cache-hit != 'true'
        run: |
          cd ~
          git clone --depth 1 --recurse-submodules https://github.com/DMTF/spdm-emu.git
          cd spdm-emu
          mkdir build && cd build
          cmake -DARCH=${{ matrix.arch }} -DTOOLCHAIN=GCC -DTARGET=Release -DCRYPTO=openssl ..
          make copy_sample_key
          make -j"$(nproc)" spdm_responder_emu

      # --- ML-DSA interop: responder offers only ML-DSA, requester verifies.
      #     ML-DSA-44/65 fit spdm-emu's DataTransferSize (4608 B) in one message;
      #     ML-DSA-87 (sig 4627 B) exceeds it and the responder chunks the
      #     response, exercising CHUNK_GET reassembly on both the cleartext
      #     (KEY_EXCHANGE/CHALLENGE) and secured (MEASUREMENTS) paths.
      - name: ML-DSA 44/65/87 session + measurements + challenge
        run: |
          export LD_LIBRARY_PATH=$HOME/wolfspdm-install/lib:$HOME/wolfssl-install/lib
          export SPDM_EMU_PATH=$HOME/spdm-emu/build/bin
          DEMO=./examples/spdm_demo
          FAILURES=""

          # Wait until the responder is accepting connections on port 2323.
          wait_for_port() {
            local i
            for i in $(seq 1 50); do
              if ss -ltn 2>/dev/null | grep -q ':2323 '; then return 0; fi
              sleep 0.2
            done
            return 1
          }

          # $1 ML_DSA_xx (responder), $2 cert dir, $3 demo label, then demo args.
          # The OpenSSL-backed ML-DSA responder is slower to become ready than
          # the mbedtls/ECDSA one, and it stops after a failed connection, so
          # retry the whole case (restarting the responder) a few times.
          # Records (does NOT exit on) failures so every ML-DSA size and flow is
          # exercised and reported, not masked by the first failure.
          run_case() {
            local alg="$1" certdir="$2" label="$3"; shift 3
            export SPDM_EMU_CERT_DIR="$certdir"
            echo "::group::$alg $label"
            local attempt rc=1 emu
            for attempt in 1 2 3; do
              ( cd "$SPDM_EMU_PATH" && ./spdm_responder_emu --ver 1.4 \
                  --hash SHA_384 --asym NONE --pqc_asym "$alg" \
                  --dhe SECP_384_R1 --aead AES_256_GCM \
                  >/tmp/pqc_emu_${alg}_${label}.log 2>&1 ) &
              emu=$!
              if wait_for_port; then
                sleep 1
                if "$DEMO" "$@" --ver 1.4 --debug; then rc=0; else rc=$?; fi
              else
                rc=1
              fi
              kill $emu 2>/dev/null || true
              wait $emu 2>/dev/null || true
              pkill -f spdm_responder_emu 2>/dev/null || true
              [ $rc -eq 0 ] && break
              echo "--- responder log (attempt $attempt) ---"
              cat /tmp/pqc_emu_${alg}_${label}.log || true
              echo "attempt $attempt for $alg $label failed (rc=$rc), retrying"
              sleep 1
            done
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$alg $label failed after retries (rc=$rc)"
              FAILURES="$FAILURES $alg/$label"
            else
              echo "$alg $label: OK"
            fi
          }

          for spec in "ML_DSA_44 mldsa44" "ML_DSA_65 mldsa65" "ML_DSA_87 mldsa87"; do
            set -- $spec
            alg="$1"; dir="$2"
            run_case "$alg" "$dir" session   --emu
            run_case "$alg" "$dir" meas      --meas
            run_case "$alg" "$dir" challenge --challenge
          done

          if [ -n "$FAILURES" ]; then
            echo "::error::ML-DSA interop failures:$FAILURES"
            exit 1
          fi
          echo "All ML-DSA 44/65/87 interop cases passed."

      # --- ML-KEM interop: responder offers only ML-KEM (--dhe NONE) with ECDSA
      #     signing, so the handshake performs ML-KEM key exchange in isolation.
      #     The requester forces KEM-only advertisement with --kex. ek (<=1568 B)
      #     and ciphertext c (<=1568 B) fit one message under the responder's
      #     DataTransferSize, so this tests the KEM path without chunking.
      - name: ML-KEM 512/768/1024 session + measurements + challenge
        run: |
          export LD_LIBRARY_PATH=$HOME/wolfspdm-install/lib:$HOME/wolfssl-install/lib
          export SPDM_EMU_PATH=$HOME/spdm-emu/build/bin
          export SPDM_EMU_CERT_DIR=ecp384
          DEMO=./examples/spdm_demo
          FAILURES=""

          wait_for_port() {
            local i
            for i in $(seq 1 50); do
              if ss -ltn 2>/dev/null | grep -q ':2323 '; then return 0; fi
              sleep 0.2
            done
            return 1
          }

          # $1 emu KEM name, $2 demo --kex name, $3 label, then demo args.
          run_kem() {
            local kem="$1" kex="$2" label="$3"; shift 3
            echo "::group::$kem $label"
            local attempt rc=1 emu
            for attempt in 1 2 3; do
              ( cd "$SPDM_EMU_PATH" && ./spdm_responder_emu --ver 1.4 \
                  --hash SHA_384 --asym ECDSA_P384 --pqc_asym NONE \
                  --dhe NONE --kem "$kem" --aead AES_256_GCM \
                  >/tmp/pqc_emu_${kem}_${label}.log 2>&1 ) &
              emu=$!
              if wait_for_port; then
                sleep 1
                if "$DEMO" "$@" --ver 1.4 --kex "$kex" --debug; then rc=0; else rc=$?; fi
              else
                rc=1
              fi
              kill $emu 2>/dev/null || true
              wait $emu 2>/dev/null || true
              pkill -f spdm_responder_emu 2>/dev/null || true
              [ $rc -eq 0 ] && break
              echo "--- responder log (attempt $attempt) ---"
              cat /tmp/pqc_emu_${kem}_${label}.log || true
              echo "attempt $attempt for $kem $label failed (rc=$rc), retrying"
              sleep 1
            done
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$kem $label failed after retries (rc=$rc)"
              FAILURES="$FAILURES $kem/$label"
            else
              echo "$kem $label: OK"
            fi
          }

          for spec in "ML_KEM_512 mlkem512" "ML_KEM_768 mlkem768" \
                      "ML_KEM_1024 mlkem1024"; do
            set -- $spec
            kem="$1"; kex="$2"
            run_kem "$kem" "$kex" session   --emu
            run_kem "$kem" "$kex" meas      --meas
            run_kem "$kem" "$kex" challenge --challenge
          done

          if [ -n "$FAILURES" ]; then
            echo "::error::ML-KEM interop failures:$FAILURES"
            exit 1
          fi
          echo "All ML-KEM 512/768/1024 interop cases passed."

      # --- Full post-quantum handshake: ML-KEM-768 key exchange + ML-DSA
      #     signing together, no classical asymmetric crypto. ML-DSA-65 fits one
      #     message; ML-DSA-87 (sig 4627 B) + ciphertext c (1088 B) exceeds the
      #     DataTransferSize, so this case also exercises CHUNK_GET reassembly -
      #     ML-KEM + ML-DSA + chunking in a single handshake.
      - name: Full PQ (ML-KEM-768 + ML-DSA 65/87) session, attestation, key update, app data
        run: |
          export LD_LIBRARY_PATH=$HOME/wolfspdm-install/lib:$HOME/wolfssl-install/lib
          export SPDM_EMU_PATH=$HOME/spdm-emu/build/bin
          DEMO=./examples/spdm_demo
          FAILURES=""

          wait_for_port() {
            local i
            for i in $(seq 1 50); do
              if ss -ltn 2>/dev/null | grep -q ':2323 '; then return 0; fi
              sleep 0.2
            done
            return 1
          }

          # $1 pqc_asym (ML_DSA_xx), $2 cert dir, $3 label, then demo args. KEM is
          # ML-KEM-768 throughout; the requester forces it with --kex mlkem768.
          run_pq() {
            local pqc="$1" certdir="$2" label="$3"; shift 3
            export SPDM_EMU_CERT_DIR="$certdir"
            echo "::group::$pqc+ML_KEM_768 $label"
            local attempt rc=1 emu
            for attempt in 1 2 3; do
              ( cd "$SPDM_EMU_PATH" && ./spdm_responder_emu --ver 1.4 \
                  --hash SHA_384 --asym NONE --pqc_asym "$pqc" \
                  --dhe NONE --kem ML_KEM_768 --aead AES_256_GCM \
                  >/tmp/pqc_emu_${pqc}_kem_${label}.log 2>&1 ) &
              emu=$!
              if wait_for_port; then
                sleep 1
                if "$DEMO" "$@" --ver 1.4 --kex mlkem768 --debug; then rc=0; else rc=$?; fi
              else
                rc=1
              fi
              kill $emu 2>/dev/null || true
              wait $emu 2>/dev/null || true
              pkill -f spdm_responder_emu 2>/dev/null || true
              [ $rc -eq 0 ] && break
              echo "--- responder log (attempt $attempt) ---"
              cat /tmp/pqc_emu_${pqc}_kem_${label}.log || true
              echo "attempt $attempt for $pqc+KEM $label failed (rc=$rc), retrying"
              sleep 1
            done
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::$pqc+ML_KEM_768 $label failed after retries (rc=$rc)"
              FAILURES="$FAILURES $pqc+kem/$label"
            else
              echo "$pqc+ML_KEM_768 $label: OK"
            fi
          }

          for spec in "ML_DSA_65 mldsa65" "ML_DSA_87 mldsa87"; do
            set -- $spec
            pqc="$1"; dir="$2"
            run_pq "$pqc" "$dir" session   --emu
            run_pq "$pqc" "$dir" meas      --meas
            run_pq "$pqc" "$dir" challenge --challenge
            run_pq "$pqc" "$dir" heartbeat --heartbeat
            run_pq "$pqc" "$dir" keyupdate --key-update
            run_pq "$pqc" "$dir" appdata   --app-data
          done

          if [ -n "$FAILURES" ]; then
            echo "::error::Full-PQ interop failures:$FAILURES"
            exit 1
          fi
          echo "All full-PQ (ML-KEM + ML-DSA) interop cases passed."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spdm-emu-pqc-logs-${{ matrix.os }}-${{ matrix.arch }}-dynmem-${{ matrix.dynamic-mem }}
          path: |
            config.log
            test/*.log
            /tmp/pqc_emu_*.log
          retention-days: 5
