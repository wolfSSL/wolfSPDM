name: wolfSSL Version Matrix

on:
  push:
    branches: [ 'main', 'wolftpm-core', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  repository_dispatch:
    types: [nightly-trigger]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolve the latest -stable wolfSSL tag at run time so we don't have to
  # bump this workflow every release. Floor (v5.8.0) and master are fixed:
  # v5.8.0 matches the LIBWOLFSSL_VERSION_HEX gate in configure.ac, and
  # master surfaces upstream drift on the nightly run.
  discover-versions:
    name: Resolve wolfSSL version matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      latest-stable: ${{ steps.set-matrix.outputs.latest-stable }}
    steps:
      - name: Resolve latest -stable wolfSSL tag
        id: set-matrix
        run: |
          set -euo pipefail
          # List remote v*-stable tags, version-sort, take the highest.
          # Equivalent to `git tag -l 'v*-stable' | sort -V | tail -1` in a
          # local clone, but avoids cloning just to read tag names.
          LATEST=$(git ls-remote --tags --refs https://github.com/wolfSSL/wolfssl.git 'v*-stable' \
                     | awk -F/ '{print $NF}' | sort -V | tail -n 1)
          if [ -z "${LATEST:-}" ]; then
            echo "::error::Could not resolve latest wolfSSL -stable tag from remote"
            exit 1
          fi
          echo "Latest stable wolfSSL: $LATEST"
          echo "latest-stable=$LATEST" >> "$GITHUB_OUTPUT"
          # ML-DSA (the wc_MlDsaKey context API wolfSPDM verifies with) lands
          # post-v5.9.1-stable. Enable it for master and any latest-stable
          # strictly newer than v5.9.1-stable; v5.8.0 floor stays classical.
          PQC_LATEST=false
          NEWEST=$(printf '%s\n%s\n' "v5.9.1-stable" "$LATEST" | sort -V | tail -n1)
          if [ "$NEWEST" = "$LATEST" ] && [ "$LATEST" != "v5.9.1-stable" ]; then
            PQC_LATEST=true
          fi
          echo "PQC for latest-stable: $PQC_LATEST"
          MATRIX=$(jq -nc --arg latest "$LATEST" --argjson pqclatest "$PQC_LATEST" '{
            include: [
              {"wolfssl-version":"v5.8.0-stable","wolfssl-ref":"v5.8.0-stable","cache-key":"wolfssl-spdm-v5.8.0-v2","pqc":false},
              {"wolfssl-version":$latest,"wolfssl-ref":$latest,"cache-key":("wolfssl-spdm-" + $latest + "-pqc" + ($pqclatest|tostring) + "-v2"),"pqc":$pqclatest},
              {"wolfssl-version":"master","wolfssl-ref":"master","cache-key":"","pqc":true}
            ]
          }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-test:
    name: wolfSSL ${{ matrix.wolfssl-version }}
    needs: discover-versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}

    steps:
      - name: Checkout wolfSPDM
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool

      - name: Cache wolfSSL ${{ matrix.wolfssl-version }}
        if: matrix.wolfssl-version != 'master'
        id: cache-wolfssl
        uses: actions/cache@v4
        with:
          path: ~/wolfssl-install
          key: ${{ matrix.cache-key }}

      - name: Build wolfSSL ${{ matrix.wolfssl-version }}
        if: matrix.wolfssl-version == 'master' || steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: |
          cd ~
          git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} \
              https://github.com/wolfSSL/wolfssl.git
          cd wolfssl
          PQC_FLAGS=""
          if [ "${{ matrix.pqc }}" = "true" ]; then PQC_FLAGS="--enable-mldsa"; fi
          ./autogen.sh
          ./configure --enable-wolftpm --enable-ecc --enable-sha384 \
                      --enable-aesgcm --enable-hkdf --enable-sp $PQC_FLAGS \
                      --prefix=$HOME/wolfssl-install
          make -j"$(nproc)"
          make install

      - name: wolfSSL version info
        run: |
          grep LIBWOLFSSL_VERSION_STRING $HOME/wolfssl-install/include/wolfssl/version.h
          grep LIBWOLFSSL_VERSION_HEX $HOME/wolfssl-install/include/wolfssl/version.h

      - name: Build wolfSPDM
        run: |
          # On PQC-capable wolfSSL, pass --enable-mldsa so configure ERRORS if
          # the wc_MlDsaKey API is somehow missing, instead of silently
          # dropping ML-DSA coverage.
          MLDSA_FLAG=""
          if [ "${{ matrix.pqc }}" = "true" ]; then MLDSA_FLAG="--enable-mldsa"; fi
          ./autogen.sh
          ./configure --with-wolfssl=$HOME/wolfssl-install --enable-nuvoton --enable-nations --enable-responder $MLDSA_FLAG
          make -j"$(nproc)"

      - name: Run unit tests
        run: make check
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/.libs:${{ env.HOME }}/wolfssl-install/lib

      - name: Build with --enable-dynamic-mem
        run: |
          MLDSA_FLAG=""
          if [ "${{ matrix.pqc }}" = "true" ]; then MLDSA_FLAG="--enable-mldsa"; fi
          make distclean || true
          ./autogen.sh
          ./configure --with-wolfssl=$HOME/wolfssl-install --enable-nuvoton --enable-nations --enable-responder --enable-dynamic-mem $MLDSA_FLAG
          make -j"$(nproc)"

      - name: Run unit tests (dynamic-mem)
        run: make check
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/.libs:${{ env.HOME }}/wolfssl-install/lib

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wolfssl-versions-${{ matrix.wolfssl-version }}-logs
          path: |
            config.log
            test/*.log
            test-suite.log
          retention-days: 5
